<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Doctor - Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    display:flex;
    width:900px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.2);
}

.left{
    flex:1;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    color:#fff;
    padding:50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{font-size:32px;margin-bottom:10px;}
.left p{opacity:0.9;font-size:14px;}

.right{
    flex:1;
    padding:40px;
}

.right h2{
    text-align:center;
    margin-bottom:20px;
    color:#4facfe;
}

input, select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

input:focus, select:focus{
    border-color:#4facfe;
    box-shadow:0 0 5px rgba(79,172,254,0.4);
}

.btn{
    width:100%;
    padding:12px;
    margin-top:12px;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    border:none;
    color:#fff;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.footer{
    text-align:center;
    margin-top:10px;
    font-size:13px;
}

.footer a{
    color:#4facfe;
    text-decoration:none;
}

.msg{
    text-align:center;
    margin-top:10px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="left">
    <h1>Welcome 👋</h1>
    <p>Join AI Doctor System and experience smart healthcare, instant booking & AI diagnosis.</p>
</div>

<div class="right">

<h2>Create Account</h2>

<form id="signupForm">

<select id="role" required>
<option value="patient">Patient</option>
<option value="doctor">Doctor</option>
</select>

<input type="text" id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>
<input type="password" id="confirmPassword" placeholder="Confirm Password" required>

<button class="btn" id="btn">Signup</button>

</form>

<div class="msg" id="msg"></div>

<div class="footer">
Already have an account? <a href="index.html">Login</a>
</div>

</div>
</div>

<script src="assets/js/config.js"></script>
<script>
const form = document.getElementById("signupForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const role = document.getElementById("role").value;
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // Validation
    if(!name || !email || !password){
        msg.innerHTML = "⚠️ All fields are required";
        msg.style.color = "red";
        return;
    }

    if(password !== confirmPassword){
        msg.innerHTML = "❌ Passwords do not match";
        msg.style.color = "red";
        return;
    }

    if(password.length < 6){
        msg.innerHTML = "⚠️ Password must be at least 6 characters";
        msg.style.color = "red";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Creating...";

    try{
        const res = await fetch(`${API_BASE_URL}/auth/signup`, {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({role, name, email, password})
        });

        // 🔥 SAFE JSON PARSE (no crash)
        const data = await res.json().catch(() => ({}));

        console.log("STATUS:", res.status);
        console.log("DATA:", data);

        if(res.ok && data.success){
            msg.innerHTML = "✅ Account created successfully!";
            msg.style.color = "green";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);
        } else {
            msg.innerHTML = data.message || "Signup failed";
            msg.style.color = "red";
        }

    } catch(err){
        console.log(err);
        msg.innerHTML = "❌ Server not responding";
        msg.style.color = "red";
    }

    btn.disabled = false;
    btn.innerText = "Signup";
});
</script>

</body>
</html>
