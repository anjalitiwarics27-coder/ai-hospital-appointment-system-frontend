<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Appointment - AI Doctor System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#eef6ff,#f7fbff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* CONTAINER */
.container{
    width:900px;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.1);
    display:flex;
}

/* LEFT */
.left{
    flex:1;
    background:linear-gradient(135deg,#2b7cff,#1f5ed6);
    color:#fff;
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{
    font-size:32px;
    margin-bottom:15px;
}

.left p{
    font-size:14px;
    line-height:1.6;
    opacity:0.9;
}

/* RIGHT */
.right{
    flex:1.2;
    padding:35px;
}

.right h2{
    text-align:center;
    color:#2b7cff;
    margin-bottom:15px;
}

/* FORM */
.form-group{
    margin:10px 0;
}

label{
    font-size:13px;
    color:#333;
    display:block;
    margin-bottom:5px;
}

input, select, textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:14px;
    transition:0.3s;
}

input:focus, select:focus, textarea:focus{
    border-color:#2b7cff;
    box-shadow:0 0 6px rgba(43,124,255,0.2);
}

textarea{
    resize:none;
    height:90px;
}

.row{
    display:flex;
    gap:10px;
}

.row .form-group{
    flex:1;
}

/* BUTTON */
.btn{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:linear-gradient(135deg,#2b7cff,#155ed6);
    color:#fff;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.03);
}

.note{
    font-size:12px;
    color:#777;
    text-align:center;
    margin-top:10px;
}

/* RESPONSIVE */
@media(max-width:768px){
    .container{
        flex-direction:column;
        width:100%;
    }
    .row{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <h1>Book Appointment</h1>
        <p>
            Easily book your doctor appointment in seconds.
            Choose doctor, date, time and symptoms.
        </p>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <h2>Appointment Form</h2>

        <form id="appointmentForm">

            <div class="form-group">
                <label>Select Doctor</label>
                <select id="doctor" required>
                    <option value="">-- Choose Doctor --</option>
                    <option>Dr. Anjali Sharma (Cardiologist)</option>
                    <option>Dr. Rahul Verma (Neurologist)</option>
                    <option>Dr. Neha Kapoor (Dermatologist)</option>
                    <option>Dr.Anjali Tiwari(Cardiologist)</option>
                </select>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Date</label>
                    <input id="date" type="date" required />
                </div>

                <div class="form-group">
                    <label>Time</label>
                    <input id="time" type="time" required />
                </div>
            </div>

            <div class="form-group">
                <label>Patient Name</label>
                <input id="name" type="text" placeholder="Enter your name" required />
            </div>
            <div class="form-group">
                <label>Patient phone</label>
                <input id="phone" type="tel" placeholder="Enter phone number" required />
            </div>

            <div class="form-group">
                <label>Email</label>
                <input id="email" type="email" placeholder="Enter email" required />
            </div>

            <div class="form-group">
                <label>Symptoms</label>
                <textarea id="symptoms" placeholder="Describe your symptoms..."></textarea>
            </div>
            <a href="view.html">

            <button type="submit" class="btn" >Book Appointment</button>

            <div class="note">Your data is safe 🔒</div></a>


        </form>

    </div>

</div>

<script>
document.getElementById("appointmentForm").addEventListener("submit", function(e){
    e.preventDefault();

    const obj = {
        id: Date.now(),
        doctor: document.getElementById("doctor").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        symptoms: document.getElementById("symptoms").value,
        status: "Pending",
        bookedAt: new Date().toLocaleString(),
        confirmedTime: ""
    };

    let arr = JSON.parse(localStorage.getItem("appointments")) || [];
    arr.push(obj);
    localStorage.setItem("appointments", JSON.stringify(arr));

    alert("Appointment Booked Successfully ✔");

    this.reset();

    window.location.href = "dashboard.html";
});
</script>

</body>
</html>
