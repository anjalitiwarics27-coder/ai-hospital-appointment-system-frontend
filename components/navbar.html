<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Doctor Navbar</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#f4f8ff;
}

/* NAVBAR */
.navbar{
    width:100%;
    height:65px;
    background:linear-gradient(90deg,#2b7cff,#1f5ed6);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

/* LOGO */
.logo{
    color:#fff;
    font-size:18px;
    font-weight:600;
}

.logo span{
    color:#ffdd57;
}

/* LINKS */
.nav-links{
    display:flex;
    gap:18px;
    align-items:center;
}

.nav-links a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    padding:8px 12px;
    border-radius:8px;
    transition:0.3s;
}

.nav-links a:hover,
.nav-links a.active{
    background:rgba(255,255,255,0.25);
}

/* PROFILE */
.profile{
    display:flex;
    align-items:center;
    gap:10px;
    color:#fff;
    cursor:pointer;
}

.avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#fff;
    color:#2b7cff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:600;
}

/* LOGOUT */
.logout{
    font-size:12px;
    padding:6px 10px;
    background:#ff4d4d;
    border-radius:8px;
    cursor:pointer;
    color:#fff;
}

/* MOBILE */
.menu-btn{
    display:none;
    font-size:22px;
    color:#fff;
    cursor:pointer;
}

@media(max-width:768px){
    .nav-links{
        position:absolute;
        top:65px;
        left:0;
        width:100%;
        background:#1f5ed6;
        flex-direction:column;
        display:none;
        padding:10px 0;
    }

    .nav-links.active{
        display:flex;
    }

    .menu-btn{
        display:block;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div class="logo">
        AI <span>Doctor</span>
    </div>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <div class="nav-links" id="navLinks">
        <a href="dashboard.html">Home</a>
        <a href="appointments.html">Appointments</a>
        <a href="reports.html">Reports</a>
        <a href="chat.html">Chat</a>
        <a href="prescriptions.html">Prescriptions</a>
    </div>

    <div class="profile">
        <div class="avatar" id="userAvatar">U</div>
        <span id="userName">User</span>
        <span class="logout" onclick="logout()">Logout</span>
    </div>

</div>

<script>
/* =========================
   MOBILE MENU
========================= */
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("active");
}

/* =========================
   SAFE SESSION LOAD
========================= */
function getSession(){
    try{
        return JSON.parse(localStorage.getItem("ai_doctor_session"));
    }catch(e){
        return null;
    }
}

/* =========================
   LOAD USER INFO
========================= */
window.addEventListener("load", function(){

    const user = getSession();

    if(user){
        document.getElementById("userName").innerText = user.name || "User";
        document.getElementById("userAvatar").innerText = (user.name || "U").charAt(0).toUpperCase();
    }
});

/* =========================
   LOGOUT
========================= */
function logout(){
    localStorage.removeItem("ai_doctor_session");
    alert("Logged out successfully ✔");
    window.location.href = "../login.html";
}
</script>

</body>
</html>
